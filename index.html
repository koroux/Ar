<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>AR Trace Studio Pro</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* CAPA 0: Cámara trasera */
    #camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Cuadrícula guía opcional */
    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: none;
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.12) 1px, transparent 1px);
    }
    #grid-overlay.active {
      display: block;
    }

    /* CAPA 1: Imagen / Canvas */
    #overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      touch-action: none;
    }
    #overlay-container.locked {
      pointer-events: none;
    }
    #trace-target {
      position: absolute;
      transform-origin: center center;
      opacity: 0.55;
      display: none;
      will-change: transform, opacity;
    }

    /* Placeholder inicial si no hay imagen */
    #empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      background: rgba(15, 23, 42, 0.85);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      padding: 24px 30px;
      border-radius: 20px;
      color: #fff;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 85vw;
    }
    #empty-state h3 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      font-weight: 600;
    }
    #empty-state p {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    /* CAPA 2: Paneles UI */
    .ui-panel {
      position: absolute;
      z-index: 20;
      display: flex;
      gap: 8px;
      align-items: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .top-bar {
      top: env(safe-area-inset-top, 16px);
      left: 14px;
      right: 14px;
      justify-content: space-between;
    }
    .bottom-bar {
      bottom: env(safe-area-inset-bottom, 16px);
      left: 12px;
      right: 12px;
      background: rgba(15, 17, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 16px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    /* Ocultar UI en modo calco limpio */
    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(15px);
    }
    .top-bar.ui-hidden {
      transform: translateY(-15px);
    }

    /* Botón flotante para recuperar UI cuando está oculta */
    #show-ui-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 25;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      backdrop-filter: blur(8px);
    }
    #show-ui-btn.visible {
      display: flex;
    }

    /* Botones y Estilos */
    .btn {
      background: rgba(30, 41, 59, 0.8);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      touch-action: manipulation;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }
    .btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    /* Sliders de ajuste */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 500;
    }
    .slider-row span {
      min-width: 60px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 4px;
      accent-color: #3b82f6;
      outline: none;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .tool-grid .btn {
      padding: 8px 4px;
      font-size: 11px;
      flex-direction: column;
      gap: 3px;
    }
    .tool-grid .btn span.icon {
      font-size: 17px;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 0. Video de cámara -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Cuadrícula de referencia opcional -->
  <div id="grid-overlay"></div>

  <!-- 1. Capa de dibujo / calco -->
  <div id="overlay-container">
    <canvas id="trace-target"></canvas>
  </div>

  <!-- Cartel si no hay imagen -->
  <div id="empty-state">
    <h3>🎨 AR Trace Studio</h3>
    <p>Apunta tu cámara a tu hoja o libreta e importa un dibujo o foto para empezar a calcar.</p>
    <label class="btn btn-primary" style="display:inline-flex; width:100%; justify-content:center;">
      📁 Cargar Imagen
      <input type="file" id="file-input-empty" accept="image/*" style="display: none;">
    </label>
  </div>

  <!-- 2. Barra Superior -->
  <div class="ui-panel top-bar" id="top-bar">
    <label class="btn">
      📁 Nueva
      <input type="file" id="file-input" accept="image/*" style="display: none;">
    </label>
    <div style="display: flex; gap: 8px;">
      <button class="btn" id="hide-ui-btn" title="Ocultar interfaz para calcar limpio">👁️ Calcar</button>
      <button class="btn" id="lock-btn">🔓 Libre</button>
    </div>
  </div>

  <!-- Botón de reactivación rápida -->
  <button id="show-ui-btn">⚙️</button>

  <!-- 3. Barra Inferior -->
  <div class="ui-panel bottom-bar" id="bottom-bar">
    <!-- Slider Opacidad -->
    <div class="slider-row">
      <span>Opacidad</span>
      <input type="range" id="opacity-slider" min="0.05" max="1" step="0.05" value="0.55">
    </div>

    <!-- Slider Sensibilidad de Líneas (visible cuando modo líneas está activo) -->
    <div class="slider-row" id="edge-threshold-row" style="display: none;">
      <span>Bordes</span>
      <input type="range" id="edge-slider" min="15" max="90" step="2" value="40">
    </div>

    <!-- Botones de herramientas -->
    <div class="tool-grid">
      <button class="btn" id="edge-btn"><span class="icon">✏️</span>Líneas</button>
      <button class="btn" id="torch-btn"><span class="icon">💡</span>Linterna</button>
      <button class="btn" id="grid-btn"><span class="icon">📐</span>Guía</button>
      <button class="btn" id="mirror-btn"><span class="icon">🪞</span>Espejo</button>
      <button class="btn" id="invert-btn"><span class="icon">🌓</span>Invertir</button>
      <button class="btn" id="cam-switch-btn"><span class="icon">🔄</span>Cámara</button>
      <button class="btn" id="rot-btn"><span class="icon">🔁</span>90°</button>
      <button class="btn" id="reset-btn"><span class="icon">🎯</span>Centrar</button>
    </div>
  </div>
</div>

<script>
  // Registrar Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    });
  }

  // Wake Lock API: Impide que la pantalla se apague mientras calcamos
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) {
      console.log('Wake Lock no disponible o denegado:', err);
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      requestWakeLock();
    }
  });

  // Elementos DOM
  const video = document.getElementById('camera-feed');
  const canvas = document.getElementById('trace-target');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const overlayContainer = document.getElementById('overlay-container');
  const emptyState = document.getElementById('empty-state');
  const gridOverlay = document.getElementById('grid-overlay');

  const topBar = document.getElementById('top-bar');
  const bottomBar = document.getElementById('bottom-bar');
  const showUiBtn = document.getElementById('show-ui-btn');
  const hideUiBtn = document.getElementById('hide-ui-btn');

  const fileInput = document.getElementById('file-input');
  const fileInputEmpty = document.getElementById('file-input-empty');
  const opacitySlider = document.getElementById('opacity-slider');
  const edgeSlider = document.getElementById('edge-slider');
  const edgeThresholdRow = document.getElementById('edge-threshold-row');

  const lockBtn = document.getElementById('lock-btn');
  const edgeBtn = document.getElementById('edge-btn');
  const torchBtn = document.getElementById('torch-btn');
  const gridBtn = document.getElementById('grid-btn');
  const mirrorBtn = document.getElementById('mirror-btn');
  const invertBtn = document.getElementById('invert-btn');
  const camSwitchBtn = document.getElementById('cam-switch-btn');
  const rotBtn = document.getElementById('rot-btn');
  const resetBtn = document.getElementById('reset-btn');

  // Estados
  let currentStream = null;
  let currentTrack = null;
  let facingMode = "environment";
  let torchState = false;
  let isLocked = false;
  let isMirrored = false;
  let isInverted = false;
  let isEdgeMode = false;
  let rawImage = null;

  // Transformaciones
  let scale = 1;
  let rotation = 0; // grados
  let posX = 0;
  let posY = 0;

  // 1. Iniciar Cámara con WakeLock
  async function startCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }
    try {
      const constraints = {
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      currentTrack = currentStream.getVideoTracks()[0];
      requestWakeLock();
    } catch (err) {
      console.error("Cámara no disponible:", err);
      alert("Permiso de cámara necesario para proyectar sobre el papel.");
    }
  }

  camSwitchBtn.addEventListener('click', () => {
    facingMode = (facingMode === "environment") ? "user" : "environment";
    startCamera();
  });

  // Linterna
  torchBtn.addEventListener('click', async () => {
    if (!currentTrack) return;
    try {
      const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
      if (caps.torch) {
        torchState = !torchState;
        await currentTrack.applyConstraints({ advanced: [{ torch: torchState }] });
        torchBtn.classList.toggle('active', torchState);
      } else {
        alert("La linterna no es compatible con el navegador en este dispositivo.");
      }
    } catch (e) {
      console.error(e);
    }
  });

  // 2. Carga y Procesamiento de Imagen
  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        rawImage = img;
        emptyState.style.display = 'none';
        canvas.style.display = 'block';
        renderCanvas();
        resetTransform();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
  fileInputEmpty.addEventListener('change', (e) => handleFile(e.target.files[0]));

  function renderCanvas() {
    if (!rawImage) return;
    canvas.width = rawImage.width;
    canvas.height = rawImage.height;

    if (isEdgeMode) {
      applyEdgeDetection();
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.filter = isInverted ? 'invert(1)' : 'none';
      ctx.drawImage(rawImage, 0, 0);
      ctx.filter = 'none';
    }
  }

  // Algoritmo Sobel para extracción de contornos
  function applyEdgeDetection() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.drawImage(rawImage, 0, 0, w, h);
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const gray = new Uint8ClampedArray(w * h);
    for (let i = 0; i < data.length; i += 4) {
      gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    }

    const output = ctx.createImageData(w, h);
    const out = output.data;
    const thresh = parseInt(edgeSlider.value, 10);
    const lineVal = isInverted ? 255 : 0; // Línea blanca o negra según inversión

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        const gx =
          -gray[idx - w - 1] + gray[idx - w + 1] +
          -2 * gray[idx - 1] + 2 * gray[idx + 1] +
          -gray[idx + w - 1] + gray[idx + w + 1];

        const gy =
          -gray[idx - w - 1] - 2 * gray[idx - w] - gray[idx - w + 1] +
          gray[idx + w - 1] + 2 * gray[idx + w] + gray[idx + w + 1];

        const mag = Math.hypot(gx, gy);
        const pIdx = idx * 4;

        if (mag > thresh) {
          out[pIdx] = lineVal;
          out[pIdx + 1] = lineVal;
          out[pIdx + 2] = lineVal;
          out[pIdx + 3] = 230; // Alpha
        } else {
          out[pIdx + 3] = 0; // Transparente
        }
      }
    }
    ctx.putImageData(output, 0, 0);
  }

  // 3. Transformaciones (Pan, Pinch-to-zoom, Rotación)
  function updateTransform() {
    const flip = isMirrored ? -1 : 1;
    canvas.style.transform = `translate(${posX}px, ${posY}px) rotate(${rotation}deg) scale(${scale * flip}, ${scale})`;
  }

  function resetTransform() {
    if (!rawImage) return;
    rotation = 0;
    const maxW = window.innerWidth * 0.75;
    const maxH = window.innerHeight * 0.55;
    scale = Math.min(maxW / rawImage.width, maxH / rawImage.height);
    posX = (window.innerWidth - rawImage.width * scale) / 2;
    posY = (window.innerHeight - rawImage.height * scale) / 2;
    updateTransform();
  }

  // Gestos multitáctiles fluidos
  let touchStartDist = 0;
  let touchStartAngle = 0;
  let lastTouchX = 0;
  let lastTouchY = 0;

  overlayContainer.addEventListener('touchstart', (e) => {
    if (isLocked) return;
    if (e.touches.length === 1) {
      lastTouchX = e.touches[0].clientX - posX;
      lastTouchY = e.touches[0].clientY - posY;
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      touchStartDist = Math.hypot(dx, dy);
    }
  }, { passive: false });

  overlayContainer.addEventListener('touchmove', (e) => {
    if (isLocked) return;
    e.preventDefault();
    if (e.touches.length === 1) {
      posX = e.touches[0].clientX - lastTouchX;
      posY = e.touches[0].clientY - lastTouchY;
      updateTransform();
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);

      const factor = dist / touchStartDist;
      scale = Math.max(0.04, Math.min(scale * factor, 6.0));
      touchStartDist = dist;
      updateTransform();
    }
  }, { passive: false });

  // 4. Interfaz y Modos
  opacitySlider.addEventListener('input', (e) => {
    canvas.style.opacity = e.target.value;
  });

  edgeSlider.addEventListener('input', () => {
    if (isEdgeMode) renderCanvas();
  });

  edgeBtn.addEventListener('click', () => {
    isEdgeMode = !isEdgeMode;
    edgeBtn.classList.toggle('active', isEdgeMode);
    edgeThresholdRow.style.display = isEdgeMode ? 'flex' : 'none';
    renderCanvas();
  });

  mirrorBtn.addEventListener('click', () => {
    isMirrored = !isMirrored;
    mirrorBtn.classList.toggle('active', isMirrored);
    updateTransform();
  });

  invertBtn.addEventListener('click', () => {
    isInverted = !isInverted;
    invertBtn.classList.toggle('active', isInverted);
    renderCanvas();
  });

  gridBtn.addEventListener('click', () => {
    gridOverlay.classList.toggle('active');
    gridBtn.classList.toggle('active');
  });

  rotBtn.addEventListener('click', () => {
    rotation = (rotation + 90) % 360;
    updateTransform();
  });

  resetBtn.addEventListener('click', resetTransform);

  // Modo Bloqueo
  lockBtn.addEventListener('click', () => {
    isLocked = !isLocked;
    overlayContainer.classList.toggle('locked', isLocked);
    lockBtn.textContent = isLocked ? '🔒 Bloqueado' : '🔓 Libre';
    lockBtn.classList.toggle('active', isLocked);
  });

  // Ocultar Interfaz para calcar sin distracciones
  hideUiBtn.addEventListener('click', () => {
    topBar.classList.add('ui-hidden');
    bottomBar.classList.add('ui-hidden');
    showUiBtn.classList.add('visible');
  });

  showUiBtn.addEventListener('click', () => {
    topBar.classList.remove('ui-hidden');
    bottomBar.classList.remove('ui-hidden');
    showUiBtn.classList.remove('visible');
  });

  // Iniciar
  startCamera();
</script>
</body>
</html>
